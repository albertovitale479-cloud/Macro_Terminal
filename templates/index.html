<!doctype html>
<html lang="it" data-theme="fallout">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macro Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script>
  // evita il lampeggio del tema: lo applico prima del rendering
  try {
    var t = localStorage.getItem('mt_theme') || 'fallout';
    if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" width="24" height="24"><path d="M4 26V6M4 26h24" /><path d="M8 20l6-7 5 4 8-9" /></svg>
      </div>
      <div class="brand-text"><b>Macro</b><span>Terminal</span></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#home" data-page="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span></a>
      <a href="#macro" data-page="macro"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Macro per Paese</span></a>
      <a href="#trades" data-page="trades"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>Idee di Trade</span></a>
      <a href="#risks" data-page="risks"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18v.5"/></svg><span>Rischi Geopolitici</span></a>
      <a href="#settings" data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg><span>Impostazioni</span></a>
    </nav>
    <div class="side-foot">
      <div class="live"><i></i> Dati inseriti a mano</div>
      <button class="icon-btn" id="collapse" title="Nascondi menu">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
  </aside>

  <button class="reopen" id="reopen" title="Mostra menu"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>

  <main class="main" id="main"></main>
</div>

<div class="tooltip" id="tip"></div>
<div class="modal-back" id="modal-back"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="pipbar" id="pipbar"></div>

<script src="/static/app.js"></script>
</body>
</html>
